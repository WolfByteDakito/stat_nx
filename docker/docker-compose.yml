
services:
  mysql:
    image: mysql:8.0
    container_name: nx_licenses_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nx_licenses_stats}
      MYSQL_USER: ${MYSQL_USER:-nx_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nx_app_pwd}
      TZ: Europe/Paris
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+01:00
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - nx_licenses_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_only}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: nx_licenses_pma
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-nx_app}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-nx_app_pwd}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_HOST_PORT:-8080}:80"

volumes:
  nx_licenses_data:
    name: nx_licenses_data
